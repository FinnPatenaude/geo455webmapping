<!DOCTYPE html>
<html>
    <head>
        <title>Working with user input</title>
    </head>
    <body>
        <p>Numerator: <input type="number" id="num1" min="0" max="100" value=""></p>
        <p>Denominator: <input type="number" id="num2" min="0" max="100" value=""></p>
        
        <input type="button" id="divide" value="Divide!">
        <p id="result"></p>
        
        <script>
            var num1 = document.getElementById("num1");
            var num2 = document.getElementById("num2");
            var result = document.getElementById("result");
            
            document.getElementById("divide").addEventListener("click", function() {
                result.innerHTML = "The result is: " + num1.value / num2.value;
            });
        </script>
        
<footer class="center">

</footer>
        
    </body>
</html>
